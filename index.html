<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUNO — Two-Player Card Game</title>
    <meta name="description" content="Animated two-player UNO-style card game with spring-physics cards, solo CPU mode, and real-time QR-code multiplayer." />
    <meta property="og:title" content="PUNO — Two-Player Card Game" />
    <meta property="og:description" content="Animated two-player UNO-style card game with spring-physics cards, solo CPU mode, and real-time QR-code multiplayer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background-color:#101329;color:#f4f4ed;margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var root = document.getElementById('root');
        var bootErr = '';
        function showFallback(reason) {
          if (!root || root.childElementCount > 0) return;
          var isRawSource = !!document.querySelector('script[src="/src/main.tsx"]');
          var msg = isRawSource
            ? 'This site is serving unbuilt source files instead of the compiled bundle. On GitHub, open Settings → Pages → Build and deployment → Source → select "GitHub Actions", then run the "Deploy PUNO to GitHub Pages" workflow.'
            : reason || 'Unable to initialize the game script.';
          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;text-align:center;background:#101329;color:#f4f4ed;">' +
            '<div style="max-width:440px;background:#161d3a;border:1px solid #2b3561;border-radius:16px;padding:24px;">' +
            '<h1 style="margin:0 0 8px;font-size:28px;font-weight:800;font-style:italic;color:#f5c84b;">PUNO</h1>' +
            '<p id="puno-boot-msg" style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#c7d4d2;"></p>' +
            '<button type="button" onclick="window.location.reload()" style="padding:10px 18px;border-radius:10px;border:none;background:#f5c84b;color:#151c27;font-weight:700;cursor:pointer;">Reload</button>' +
            '</div></div>';
          var msgEl = document.getElementById('puno-boot-msg');
          if (msgEl) msgEl.textContent = msg;
        }
        window.addEventListener('error', function (e) {
          if (!bootErr && e && e.message) bootErr = String(e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (!bootErr && e && e.reason) bootErr = String(e.reason.message || e.reason);
        });
        var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
        if (rawEntry) {
          rawEntry.addEventListener('error', function () {
            showFallback('Failed to load unbuilt /src/main.tsx.');
          });
          if (/\.github\.io$/i.test(window.location.hostname)) {
            setTimeout(function () { showFallback(bootErr); }, 800);
            return;
          }
        }
        setTimeout(function () {
          if (root && root.childElementCount === 0 && bootErr) {
            showFallback(bootErr);
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
